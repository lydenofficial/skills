name: cicd_security
title: CI/CD Security
description: CI/CD pipeline security hunting — GitHub Actions workflow injection,
  secret exfiltration, self-hosted runner poisoning, dependency confusion, OIDC token
  theft, and supply chain attacks. Covers sisakulint scanning, manual workflow analysis,
  and chaining CI/CD bugs into critical findings. Use when a target has public repos,
  GitHub Actions, CircleCI, Jenkins, or GitLab CI.
category: Work and knowledge
include_in_prompt: true
