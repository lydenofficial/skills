name: client_reverse
title: Client Reverse
description: 'Client-side request-signing and anti-bot token reversal for bug bounty
  — when a request carries a sign/sig/hmac/token/nonce/timestamp/X-Sensor header that
  Burp Repeater cannot replay, recover the signer just enough to reproduce the request
  outside the client. Packet-first staging (capture real request → prove replay works
  → only reverse if replay fails) across the locate→recover→runtime→validation→replay
  spine. Covers tracing backward from the signature field (writer→builder→entry→source),
  isolating user-mutable sign inputs (timestamp/nonce/deviceId/body) vs constants
  (secret key), hooking fetch/XHR in DevTools, JS deobfuscation basics (webpack/wasm/JSVMP),
  and the bounty payoff: reach the protected API to then hunt IDOR/auth/business-logic.
  Use when Burp/mitmproxy replay of a signed or anti-bot-gated request fails and you
  suspect a client-computed field is blocking you.'
category: Work and knowledge
include_in_prompt: true
