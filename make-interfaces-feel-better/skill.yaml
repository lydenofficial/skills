name: make_interfaces_feel_better
title: Make Interfaces Feel Better
description: Design engineering principles for making interfaces feel polished. Use
  when building UI components, reviewing frontend code, implementing animations, hover
  states, shadows, borders, typography, icons, micro-interactions, enter/exit animations,
  or any visual detail work. Supports quick and full review modes. Triggers on UI
  polish, design details, "make it feel better", "feels off", stagger animations,
  border radius, optical alignment, font smoothing, tabular numbers, image outlines,
  box shadows, icons, icon stroke weight, icon states, motion restraint.
category: Work and knowledge
include_in_prompt: true
