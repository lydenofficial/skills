name: anti_ui_slop
title: Anti UI Slop
description: Stop coding agents from shipping generic UI. Use UIZZE's 800,000+ real
  web and iOS screens to build product-specific interfaces, define a design contract,
  cover required states, and run a hard finish gate. Use when designing, implementing,
  redesigning, critiquing, or pre-ship reviewing a web or iOS interface in Codex,
  Claude Code, Cursor, Copilot, or another coding agent. Trigger with "anti-ui-slop",
  "stop UI slop", "ground this UI in real screens", or "run the UI finish gate".
category: Work and knowledge
include_in_prompt: true
