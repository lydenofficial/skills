name: mcp_server_audit
title: MCP Server Audit
description: Security audit of Model Context Protocol (MCP) servers — tool poisoning,
  prompt injection via tool descriptions and results, unscoped/over-privileged tools,
  path traversal in file tools, command injection in shell/exec tools, SSRF in fetch
  tools, secret leakage through tool output, missing approval gates on state-changing
  actions, confused-deputy and rug-pull tool redefinition, token passthrough, and
  unsafe stdio/HTTP transport config. Covers auditing both first-party and third-party
  MCP servers (Python FastMCP, Node MCP SDK) and their client configs (Claude Desktop,
  Cursor, Cline, Windsurf, Zed). Use when reviewing, hardening, or hunting bugs in
  an MCP server, an agent's tool integrations, or a mcpServers config block. 中文触发词：MCP审计、工具投毒、提示注入、智能体安全、MCP服务器漏洞
category: Work and knowledge
include_in_prompt: true
