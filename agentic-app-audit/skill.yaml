name: agentic_app_audit
title: Agentic App Audit
description: Black-box security audit of a DEPLOYED AI agent (not the MCP server behind
  it) — tool-call hijacking, cross-session memory poisoning, confused-deputy via connected
  tools, agent-to-agent IDOR, excessive agency / unconfirmed destructive actions,
  and privilege compromise where the agent holds broader perms than the user. Use
  when the target is a live assistant/agent product with tool access (bookings, email,
  payments, file/RAG, browsing) rather than a raw LLM chat box or an MCP server you
  can read.
category: Work and knowledge
include_in_prompt: true
